name: Supabase keep-alive

# Calls public.keep_alive() once a day so the free Supabase project keeps
# getting database activity and doesn't pause. See
# supabase/migrations/20261029120000_keep_alive.sql.

on:
  schedule:
    # 14:17 UTC every day. Off the hour on purpose: GitHub delays or drops
    # scheduled runs at the top of the hour, when load peaks.
    - cron: '17 14 * * *'
  # The "Run workflow" button in the Actions tab.
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Repository variables (Settings > Secrets and variables > Actions >
      # Variables). Both values are public by design: the URL is in the
      # browser bundle and the publishable key is meant to ship to browsers.
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Call keep_alive()
        run: |
          set -euo pipefail

          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Repository variable $name is not set (Settings > Secrets and variables > Actions > Variables)."
              exit 1
            fi
          done

          # --fail-with-body: any HTTP error status makes curl exit non-zero
          # (so the job fails) and still prints the response body.
          # The apikey header alone is enough; a publishable key is not a JWT
          # and must not be sent as a Bearer token.
          body=$(curl --silent --show-error --fail-with-body \
            --retry 3 --retry-delay 10 --retry-all-errors \
            --max-time 30 \
            --request POST \
            --header "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            --header "Content-Type: application/json" \
            --data '{}' \
            "${SUPABASE_URL%/}/rest/v1/rpc/keep_alive")

          # A 200 from something else (a proxy, a paused-project page) is not
          # a successful ping. Only the function's own answer counts.
          if [ "$body" != '"ok"' ]; then
            echo "::error::Unexpected keep_alive response: $body"
            exit 1
          fi

          echo "keep_alive returned $body"
